server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly. If the file is not found, fallback to index.html
    # so client-side routing (SPA) can handle the path (e.g. /login, /search).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve assets normally
    location /assets/ {
        try_files $uri =404;
    }

    # Increase buffer sizes for large files if needed
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
}

