name: Deploy Services to GCP Cloud Run

on:
  workflow_run:
    workflows: [ "Build & Push Docker Images to GCP" ]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPO }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SQL_CONNECTION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

jobs:
  deploy-ai-service:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy AI Service
        if: steps.auth.outcome == 'success'
        run: |
          gcloud run deploy ecoroute-ai-service \
            --image ${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/ai-service:latest \
            --platform managed \
            --region ${REGION} \
            --memory 512Mi \
            --timeout 3600 \
            --allow-unauthenticated \
            --set-env-vars PORT=8000 \
            --quiet

      - name: Skip Deployment
        if: steps.auth.outcome != 'success'
        run: echo "GCP not configured. Skipping AI deployment."

  deploy-backend:
    needs: deploy-ai-service
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Get AI Service URL
        if: steps.auth.outcome == 'success'
        run: |
          AI_SERVICE_URL=$(gcloud run services describe ecoroute-ai-service \
            --region ${REGION} \
            --format='value(status.url)')
          echo "AI_SERVICE_URL=$AI_SERVICE_URL" >> $GITHUB_ENV

      - name: Deploy Backend
        if: steps.auth.outcome == 'success'
        run: |
          gcloud run deploy ecoroute-backend \
            --image ${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/backend:latest \
            --platform managed \
            --region ${REGION} \
            --memory 512Mi \
            --timeout 3600 \
            --allow-unauthenticated \
            --add-cloudsql-instances ${SQL_CONNECTION} \
            --set-env-vars SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/ecoroute,\
            SPRING_DATASOURCE_USERNAME=ecoroute_hdnh,\
            SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD},\
            AI_SERVICE_URL=${AI_SERVICE_URL},\
            SPRING_PROFILES_ACTIVE=gcp \
          --quiet

      - name: Skip Deployment
        if: steps.auth.outcome != 'success'
        run: echo "GCP not configured. Skipping backend deployment."

update-frontend-config:
  needs: deploy-backend
  if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
  runs-on: ubuntu-latest

  permissions:
    contents: write

  steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      continue-on-error: true
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Setup gcloud
      if: steps.auth.outcome == 'success'
      uses: google-github-actions/setup-gcloud@v2

    - name: Get Backend URL
      if: steps.auth.outcome == 'success'
      run: |
        BACKEND_URL=$(gcloud run services describe ecoroute-backend \
          --region ${REGION} \
          --format='value(status.url)')
        echo "VITE_API_URL=$BACKEND_URL" > frontend/.env.production

    - name: Commit Changes
      if: steps.auth.outcome == 'success'
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"        
        git add frontend/.env.production        
        git diff --cached --quiet || git commit -m "Update frontend backend URL"        
        git push

    - name: Skip Update
      if: steps.auth.outcome != 'success'
      run: echo "GCP not configured. Skipping frontend update."

notify-deployment:
  needs:
    - deploy-ai-service
    - deploy-backend
    - update-frontend-config
  if: always()
  runs-on: ubuntu-latest

  steps:
    - name: Deployment Summary
      run: |
        echo "Deployment workflow completed."
        echo "If GCP credentials are configured, services were deployed."
        echo "If not, deployment steps were skipped."