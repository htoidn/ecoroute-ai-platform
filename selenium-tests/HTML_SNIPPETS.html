<!-- HTML Snippets Reference for EcoRoute Selenium Tests -->

<!-- ============================================ -->
<!-- LOGIN PAGE: http://localhost:3000/login   -->
<!-- ============================================ -->

<!-- USERNAME INPUT -->
<!-- id="username" -->
<input id="username" type="text" placeholder="Enter your username" />

<!-- PASSWORD INPUT -->
<!-- id="password" -->
<input id="password" type="password" placeholder="Enter your password" />

<!-- LOGIN BUTTON -->
<!-- Contains "🚀 Start Your Journey" or "🔄 Signing In..." -->
<button type="submit">🚀 Start Your Journey</button>

<!-- ERROR MESSAGE (if login fails) -->
<!-- Contains error text with ⚠️ emoji -->
<div>⚠️ Invalid username or password</div>


<!-- ============================================================================ -->
<!-- HOME PAGE: http://localhost:3000/ (after successful login)             -->
<!-- For admin users: http://localhost:3000/recommendations                    -->
<!-- ============================================================================ -->

<!-- PROFILE BUTTON (Dropdown Trigger) -->
<!-- Contains "👤 admin" or other username -->
<button>👤 admin</button>

<!-- PROFILE DROPDOWN MENU (appears after clicking profile button) -->
<div>
  <!-- My Profile Button -->
  <button>👤 My Profile</button>

  <!-- Settings Button -->
  <button>⚙️ Settings</button>

  <!-- Logout Button -->
  <button>🚪 Logout</button>
</div>
